<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <title>College Admission Application Form</title>
</head>
<body>
  <h1>College Admission Application</h1>
  <p>Please fill out this form to apply for admission.</p>

  <form action="http://127.0.0.1:5500/submit" method="post">
    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" name="fullname" placeholder="Enter your name" required=""><br><br>

    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" required=""><br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="example@domain.com" required=""><br><br>

    <label for="mobile">Mobile Number:</label>
    <input type="tel" id="mobile" name="mobile" pattern="[0-9]{10}" required=""><br><br>

    <label for="pin">Application PIN:</label>
    <input type="password" id="pin" name="pin" required=""><br><br>

    <p>Gender:</p>
    <input type="radio" id="male" name="gender" value="male" required="">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
    <input type="radio" id="other" name="gender" value="other">
    <label for="other">Other</label><br><br>

    <label for="category">Category:</label>
    <select id="category" name="category" required="">
      <option value="disabled selected">Select</option>
      <option value="general">General</option>
      <option value="obc">OBC</option>
      <option value="sc">SC</option>
      <option value="st">ST</option>
      <option value="ews">EWS</option>
    </select><br><br>

    <label for="address">Permanent Address:</label><br>
    <textarea id="address" name="address" rows="3" cols="40" required=""></textarea><br><br>

    <label for="course">Course/Program:</label>
    <select id="course" name="course" required="">
      <option value="" disabled="" selected="">Select</option>
      <option value="btech">B.Tech</option>
      <option value="mba">MBA</option>
      <option value="mca">MCA</option>
      <option value="bsc">B.Sc</option>
      <option value="ba">B.A</option>
      <option value="bcom">B.Com</option>
    </select><br><br>

    <h2>Previous Qualification</h2>
    <label for="qualification">Qualification:</label>
    <input type="text" id="qualification" name="qualification" required=""><br><br>

    <label for="percentage">Percentage/CGPA:</label>
    <input type="number" id="percentage" name="percentage" min="0" max="100" step="0.01" required=""><br><br>

    <label for="year">Passing Year:</label>
    <input type="number" id="year" name="year" min="2000" max="2026" required=""><br><br>

    <label for="school">School/College Name:</label>
    <input type="text" id="school" name="school" required=""><br><br>

    <label for="document">Upload Document:</label>
    <input type="file" id="document" name="document" required=""><br><br>

    <input type="checkbox" id="declaration" name="declaration" value="agree" required="">
    <label for="declaration">I declare that the information is correct.</label><br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
  </form>
